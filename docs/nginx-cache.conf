# ============================================================
# Cache-Control para voeops.com — colar dentro do bloco server {}
# ============================================================

# Assets com hash no nome gerados pelo Astro (/_astro/*.js, /_astro/*.css)
# São imutáveis: o hash muda a cada build, então cache agressivo é seguro.
location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
}

# Fontes locais (não mudam sem troca manual de arquivo)
location /fonts/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
}

# Imagens locais (/_images/, /images/)
# Não têm hash, usar max-age menor para permitir invalidação
location /images/ {
    add_header Cache-Control "public, max-age=2592000"; # 30 dias
    access_log off;
}

# Widget externo — não controlamos o servidor, mas podemos fazer proxy
# Se quiser evitar 4h de TTL do /w.js do widget, configure um proxy reverso:
#
# location /widget-proxy/ {
#     proxy_pass https://widget.voeops.com/;
#     proxy_cache_valid 200 1d;
#     add_header Cache-Control "public, max-age=86400";
# }
#
# E atualize a tag <script> no Base.astro para apontar para /widget-proxy/w.js

# HTML — nunca cachear (precisa sempre refletir o build mais recente)
location ~* \.html$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
}

# ============================================================
# Sobre a imagem do Supabase (~162KB, TTL 1h)
# ============================================================
# O Supabase Storage respeita o cabeçalho Cache-Control definido no upload.
# Para aumentar o TTL, reenvie o arquivo com:
#
#   supabase storage cp --cache-control "public, max-age=2592000" \
#     local/arquivo.webp sb://seu-bucket/caminho/arquivo.webp
#
# Ou via dashboard: Storage → arquivo → "Cache Control" → altere para 2592000
# ============================================================
